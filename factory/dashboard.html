<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<style>
  :root {
    --paper: #f3f0e8; --card: #fbfaf6; --ink: #1c1b18; --muted: #7a756b; --faint: #b4ad9f;
    --rule: #dcd5c6; --pass: #2e6b4c; --pass-bg: #e2eee5; --changes: #b4441a; --changes-bg: #f6e3d9;
    --andon: #d99a0b; --andon-ink: #855600; --andon-bg: #fbf0d2; --shadow: 0 1px 0 rgba(28,27,24,.04), 0 6px 18px -10px rgba(28,27,24,.25);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131311; --card: #1b1a17; --ink: #ece8de; --muted: #918b7e; --faint: #57534a;
      --rule: #2d2b26; --pass: #74c095; --pass-bg: #1a2a20; --changes: #ec8656; --changes-bg: #33201a;
      --andon: #f0b43a; --andon-ink: #f0b43a; --andon-bg: #2c2412; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.8);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink); font: 15px/1.5 var(--serif);
    background-image: radial-gradient(var(--rule) .6px, transparent .6px); background-size: 18px 18px;
    -webkit-font-smoothing: antialiased;
  }
  .label { font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  button { font: inherit; color: inherit; }

  /* ── header ─────────────────────────────────────────── */
  header { flex: none; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
    padding: 28px 32px 18px; border-bottom: 1px solid var(--rule); background: var(--paper); }
  h1 { margin: 6px 0 0; font-weight: 400; font-size: 34px; letter-spacing: -.01em; line-height: 1; }
  h1 em { color: var(--muted); }
  .status { display: flex; align-items: center; gap: 10px; font: 12px var(--mono); color: var(--muted); }
  .hright { display: flex; align-items: center; gap: 18px; }
  .settled-btn { background: none; border: 1px solid var(--rule); border-radius: 5px; padding: 4px 10px; cursor: pointer; font: 12px var(--mono); color: var(--muted); }
  .settled-btn:hover { color: var(--ink); border-color: var(--faint); }
  .settled-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .settled-btn[hidden] { display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); box-shadow: 0 0 0 0 var(--pass); animation: beat 2s infinite; }
  .dot.down { background: var(--changes); animation: none; }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pass) 50%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 22px 32px 20px; }

  /* ── andon: needs-human ─────────────────────────────── */
  .andon { flex: none; max-height: 40vh; overflow-y: auto; margin-bottom: 22px; border: 1px solid color-mix(in srgb, var(--andon) 55%, var(--rule));
    background: repeating-linear-gradient(-45deg, var(--andon-bg) 0 14px, color-mix(in srgb, var(--andon-bg) 70%, var(--paper)) 14px 28px);
    border-radius: 8px; padding: 14px 16px 16px; }
  .andon .label { color: var(--andon-ink); display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .andon .label::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--andon); animation: andon 1.6s ease-in-out infinite; }
  @keyframes andon { 50% { opacity: .25; } }
  .andon .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .andon .card { border-color: var(--andon); box-shadow: 0 0 0 3px color-mix(in srgb, var(--andon) 22%, transparent), var(--shadow); }

  /* ── the line ───────────────────────────────────────── */
  .line { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(230px, 1fr)); grid-template-rows: minmax(0, 1fr); gap: 18px; overflow-x: auto; overflow-y: hidden; }
  .station { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .station-head { flex: none; position: relative; padding: 0 0 14px; margin-bottom: 14px; }
  .station-head::after { content: ""; position: absolute; left: 0; right: -18px; bottom: 0; border-bottom: 1px dashed var(--faint); }
  .station:last-child .station-head::after { right: 0; }
  .station-head .num { font: 12px var(--mono); color: var(--faint); }
  .station-head .name { font-size: 19px; margin: 2px 0 0; display: flex; align-items: baseline; gap: 8px; }
  .station-head .count { font: 11px var(--mono); color: var(--muted); }
  .station-head .who { font: 11px var(--mono); color: var(--faint); margin-top: 3px; }
  .station-head .tick { position: absolute; left: 0; bottom: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--faint); z-index: 1; }
  .station.live .tick { background: var(--ink); border-color: var(--ink); }
  .stack { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 4px 12px 1px; margin-left: -1px; }
  .stack > * { flex: none; }
  .empty { font: 12px var(--mono); color: var(--faint); padding: 6px 2px; }

  /* ── cards ──────────────────────────────────────────── */
  .card { display: block; width: 100%; text-align: left; cursor: pointer; background: var(--card); border: 1px solid var(--rule);
    border-radius: 7px; padding: 12px 13px 13px; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; }
  .card.new { animation: settle .35s ease both; }
  .card:hover { transform: translateY(-1px); border-color: var(--faint); }
  .card:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .card.moved { animation: settle .35s ease both, flash 1.4s ease; }
  @keyframes settle { from { opacity: 0; transform: translateY(6px); } }
  @keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 18%, transparent); } }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card .id { font: 11px var(--mono); color: var(--muted); }
  .card .rnd { font: 11px var(--mono); color: var(--muted); }
  .card .title { font-size: 16.5px; line-height: 1.25; margin: 5px 0 8px; }
  .card .branch { font: 11px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .clock { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .clock .tot { font-size: 10px; color: var(--faint); }
  .card .note { font-style: italic; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .card.merged { opacity: .72; box-shadow: none; }
  .decision { display: inline-block; margin-top: 9px; font: 600 10px/1 var(--mono); letter-spacing: .12em; padding: 4px 6px; border-radius: 3px; border: 1px solid; }
  .decision.APPROVE { color: var(--pass); border-color: currentColor; }
  .decision.ESCALATE { color: var(--andon-ink); border-color: currentColor; }

  /* reviewer chips: one row per round */
  .rounds { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .round { display: flex; align-items: flex-start; gap: 4px; }
  .round .r { font: 10px var(--mono); color: var(--faint); width: 22px; padding-top: 4px; }
  .cw { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 44px; }
  .cd { font: 9.5px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-height: 9.5px; }
  .round.past { opacity: .55; }
  .chip { font: 600 9.5px/1 var(--mono); letter-spacing: .08em; padding: 4px 0; width: 44px; text-align: center; border-radius: 3px;
    border: 1px dashed var(--faint); color: var(--faint); }
  .chip.PASS { border: 1px solid transparent; background: var(--pass-bg); color: var(--pass); }
  .chip.CHANGES { border: 1px solid transparent; background: var(--changes-bg); color: var(--changes); }
  .chip.pending.live { animation: wait 1.8s ease-in-out infinite; }
  @keyframes wait { 50% { border-color: var(--ink); color: var(--muted); } }

  .nothing { margin: auto; padding: 60px 0; max-width: 440px; text-align: center; color: var(--muted); }
  .nothing code { font: 13px var(--mono); color: var(--ink); background: var(--card); border: 1px solid var(--rule); padding: 2px 6px; border-radius: 4px; }

  /* ── drawer ─────────────────────────────────────────── */
  .scrim { position: fixed; inset: 0; z-index: 10; background: color-mix(in srgb, var(--ink) 22%, transparent); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  aside { position: fixed; z-index: 11; top: 0; right: 0; bottom: 0; width: min(860px, 94vw); background: var(--card); border-left: 1px solid var(--rule);
    transform: translateX(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1); display: grid; grid-template-columns: 200px 1fr; grid-template-rows: auto 1fr; }
  aside.open { transform: none; box-shadow: -30px 0 60px -30px rgba(0,0,0,.35); }
  .dhead { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 20px 22px 16px; border-bottom: 1px solid var(--rule); }
  .dhead h2 { margin: 4px 0 0; font-weight: 400; font-size: 24px; line-height: 1.15; }
  .close { background: none; border: 1px solid var(--rule); border-radius: 5px; padding: 4px 9px; cursor: pointer; font: 12px var(--mono); color: var(--muted); }
  .files { border-right: 1px solid var(--rule); overflow-y: auto; padding: 14px 10px; }
  .files .label { padding: 12px 8px 6px; }
  .files .label:first-child { padding-top: 0; }
  .file { display: flex; justify-content: space-between; align-items: center; gap: 6px; width: 100%; background: none; border: 0; border-radius: 5px;
    padding: 6px 8px; cursor: pointer; font: 12px var(--mono); color: var(--muted); text-align: left; }
  .file:hover { background: var(--paper); color: var(--ink); }
  .file.on { background: var(--ink); color: var(--card); }
  .file .v { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .v.PASS, .v.APPROVE { background: var(--pass); } .v.CHANGES { background: var(--changes); } .v.ESCALATE { background: var(--andon); }
  .doc { overflow-y: auto; padding: 22px 34px 60px; }
  .dsum { margin-top: 7px; font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .na { color: var(--faint); }

  /* timing view (the drawer's "timing" entry) */
  .tbar { display: flex; gap: 2px; height: 12px; margin: 4px 0 8px; }
  .seg { min-width: 3px; border-radius: 2px; background: var(--faint); }
  .seg.spec { background: color-mix(in srgb, var(--ink) 30%, transparent); }
  .seg.build { background: color-mix(in srgb, var(--ink) 80%, transparent); }
  .seg.review { background: color-mix(in srgb, var(--ink) 55%, transparent); }
  .seg.approve { background: var(--pass); }
  .seg.needs-human { background: var(--andon); }
  .tlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 1.2em; font: 11px var(--mono); color: var(--muted); }
  .tlegend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .md table.tt { font: 12px var(--mono); font-variant-numeric: tabular-nums; width: 100%; }
  .md table.tt th { font-weight: 500; color: var(--muted); }
  .md table.tt .n { text-align: right; white-space: nowrap; }
  .md .v { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }

  /* rendered markdown */
  .md { max-width: 68ch; }
  .md h1, .md h2, .md h3, .md h4 { font-weight: 400; line-height: 1.2; margin: 1.4em 0 .5em; }
  .md h1 { font-size: 26px; margin-top: .4em; } .md h2 { font-size: 20px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; } .md h3 { font-size: 17px; } .md h4 { font-size: 15px; }
  .md p, .md ul, .md ol, .md table, .md pre, .md blockquote { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; } .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md code { font: 12.5px var(--mono); background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; }
  .md pre { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; overflow-x: auto; }
  .md pre code { border: 0; padding: 0; background: none; font-size: 12px; line-height: 1.55; }
  .md blockquote { border-left: 3px solid var(--rule); padding-left: 12px; color: var(--muted); }
  .md table { border-collapse: collapse; font-size: 13.5px; } .md th, .md td { border: 1px solid var(--rule); padding: 5px 9px; text-align: left; vertical-align: top; }
  .md hr { border: 0; border-top: 1px solid var(--rule); margin: 1.5em 0; }
  .md a { color: inherit; }
  .md img { display: block; max-width: 100%; max-height: 520px; border: 1px solid var(--rule); border-radius: 6px; margin: 6px 0 4px; }
  .stamp { display: inline-block; font: 700 12px/1 var(--mono); letter-spacing: .18em; padding: 7px 10px; border: 2px solid; border-radius: 4px; transform: rotate(-1.5deg); margin-bottom: 14px; }
  .stamp.PASS, .stamp.APPROVE { color: var(--pass); } .stamp.CHANGES { color: var(--changes); } .stamp.ESCALATE { color: var(--andon-ink); }

  /* ── settled dialog ─────────────────────────────────── */
  dialog { width: min(720px, 94vw); max-height: 80vh; padding: 0; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow), 0 30px 70px -30px rgba(0,0,0,.45); }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: color-mix(in srgb, var(--ink) 22%, transparent); }
  .dlg-head { flex: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 18px 22px 14px; border-bottom: 1px solid var(--rule); }
  .dlg-head h2 { margin: 4px 0 0; font-weight: 400; font-size: 22px; line-height: 1.15; }
  .dlg-list { overflow-y: auto; padding: 6px 10px 12px; }
  .srow { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; width: 100%; text-align: left; cursor: pointer; background: none; border: 0; border-radius: 5px; padding: 10px 12px; }
  .srow:hover { background: var(--paper); }
  .srow:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .srow .st { font-size: 16px; line-height: 1.25; }
  .srow .sm { font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .srow .si { font: 11px var(--mono); color: var(--faint); }

  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div>
    <div class="label">/factory</div>
    <h1>The line <em id="tally"></em></h1>
  </div>
  <div class="hright">
    <button class="settled-btn" id="settled-btn" type="button" hidden aria-haspopup="dialog"></button>
    <div class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
  </div>
</header>
<main id="main"></main>
<div class="scrim" id="scrim"></div>
<dialog id="settled" aria-label="Settled jobs">
  <div class="dlg-head">
    <div><div class="label">Merged more than <span id="settled-hours"></span> ago</div><h2>Settled</h2></div>
    <button class="close" id="settled-close" type="button">esc</button>
  </div>
  <div class="dlg-list" id="settled-list"></div>
</dialog>
<aside id="drawer" aria-hidden="true" role="dialog" aria-label="Job files">
  <div class="dhead">
    <div><div class="label" id="d-id"></div><h2 id="d-title"></h2><div class="dsum" id="d-sum"></div></div>
    <button class="close" id="close">esc</button>
  </div>
  <nav class="files" id="files"></nav>
  <div class="doc"><div class="md" id="doc"></div></div>
</aside>

<script>
const STATIONS = [
  { key: 'spec',    name: 'Spec',    who: 'spec-writer · opus' },
  { key: 'build',   name: 'Build',   who: 'builder · opus' },
  { key: 'review',  name: 'Review',  who: 'reviewers' },
  { key: 'approve', name: 'Approve', who: 'approver · opus' },
  { key: 'merged',  name: 'Merged',  who: 'main' },
];
const ABBR = { security: 'SEC' };
const abbr = (k) => ABBR[k] || k.toUpperCase().slice(0, 4);
let reviewers = [];  // from board.config.reviewers
let settleHours = 24;  // from board.config.dashboard.settleAfterHours
const POLL_MS = 2000;

let board = null, lastText = '', lastStages = {}, openId = null, openFile = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ── polling ─────────────────────────────────────────── */
// serve.ts assembles every jobs/<id>/job.json into one /board response. Polls never overlap
// (the next is scheduled when one finishes) and pause while the tab is hidden. A failed poll
// keeps the board as it was.
const time = (iso) => new Date(iso || 0).getTime() || 0;
async function getJSON(path) {
  const res = await fetch(path, { cache: 'no-store' });
  if (!res.ok) throw new Error((await res.text().catch(() => '')).trim().split('\n')[0].slice(0, 160) || res.status);
  return res.json();
}
async function poll() {
  try {
    const data = await getJSON('board');
    const jobs = (data.jobs || []).filter((j) => j && j.id);
    const text = JSON.stringify(data);
    $('dot').classList.remove('down');
    if (text !== lastText) {
      const updated = jobs.reduce((m, j) => (time(j.updated) > time(m) ? j.updated : m), null);
      lastText = text; reviewers = data.config?.reviewers || []; settleHours = Number(data.config?.dashboard?.settleAfterHours) || 24; board = { updated, jobs }; render(); if (openId) refreshDrawer();
    }
    $('status').textContent = board.updated ? `last change ${ago(board.updated)}` : 'idle';
  } catch (err) {
    $('dot').classList.add('down');
    $('status').textContent = /^\d+$/.test(err.message) ? 'server unreachable' : `server unreachable: ${err.message}`;
    if (!board) $('main').innerHTML = `<div class="nothing">Serve it from the repo root: <code>bun run factory</code></div>`;
  }
}
function ago(iso) {
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : new Date(iso).toLocaleDateString();
}

/* ── timers ──────────────────────────────────────────── */
// Timer text is rendered into elements carrying data-since="<iso>" (and optional data-pre / data-attr).
// One 1 s interval rewrites just those elements from Date.now(), so a hidden tab (where timers are
// throttled) jumps straight to the true elapsed time on return, and nothing re-renders or re-animates.
function fmt(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}m`;
  return `${Math.floor(s / 86400)}d ${Math.floor((s % 86400) / 3600)}h`;
}
// Compact duration for the reviewer chips: 12s, 8m, 1h05m, 2d3h.
function fmtShort(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}m`;
  return `${Math.floor(s / 86400)}d${Math.floor((s % 86400) / 3600)}h`;
}
const clockText = (el, now) => `${el.dataset.pre || ''}${(el.dataset.short ? fmtShort : fmt)(now - time(el.dataset.since))}${el.dataset.post || ''}`;
function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-since]').forEach((el) => {
    const text = clockText(el, now);
    if (el.dataset.attr) { if (el.getAttribute(el.dataset.attr) !== text) el.setAttribute(el.dataset.attr, text); }
    else if (el.textContent !== text) el.textContent = text;
  });
  if (board && settledCount(board.jobs) !== shownSettled) render();  // a merge just crossed the threshold
}
setInterval(tick, 1000);
// A live timer: ticking text from `since`. `pre` is escaped here; callers pass plain text.
const live = (since, pre, cls = '') => `<span class="${cls}" data-since="${esc(since)}" data-pre="${esc(pre)}">${esc(pre + fmt(Date.now() - time(since)))}</span>`;

function clockHtml(j) {
  if (!j.startedAt || !j.stageEnteredAt) return '';  // legacy job: no timing data, no timers
  if (j.stage === 'merged') return j.endedAt ? `<div class="clock"><span>total ${fmt(time(j.endedAt) - time(j.startedAt))}</span></div>` : '';
  if (j.stage === 'needs-human') return `<div class="clock">${live(j.stageEnteredAt, 'waiting ')}</div>`;
  return `<div class="clock">${live(j.stageEnteredAt, `${j.stage} · `)}${live(j.startedAt, 'total ', 'tot')}</div>`;
}
// A reviewer chip: the tooltip reads "<key> <verdict> · <time>", and a tiny duration sits under the
// chip. Pending with an open span ticks; a closed span (finished, or closed by an escalation) shows
// its final duration; no span (legacy, or not started) shows nothing.
function chipHtml(k, round, v, span, isLive) {
  const cls = `chip ${v} ${isLive ? 'live' : ''}`;
  const wrap = (chip, dur) => `<span class="cw">${chip}<span class="cd"${dur}</span></span>`;
  if (!span) return wrap(`<span class="${cls}" title="${esc(`${k}: ${v}`)}">${esc(abbr(k))}</span>`, '>');
  if (span.finishedAt) {
    const label = v === 'pending' ? 'stopped' : v, ms = span.ms ?? time(span.finishedAt) - time(span.startedAt);
    return wrap(`<span class="${cls}" title="${esc(`${k} ${label} · ${fmt(ms)}`)}">${esc(abbr(k))}</span>`, `>${esc(fmtShort(ms))}`);
  }
  return wrap(`<span class="${cls}" data-since="${esc(span.startedAt)}" data-attr="title" data-pre="${esc(`${k} ${v} · `)}" title="${esc(`${k} ${v} · ${fmt(Date.now() - time(span.startedAt))}`)}">${esc(abbr(k))}</span>`,
    ` data-since="${esc(span.startedAt)}" data-short="1">${esc(fmtShort(Date.now() - time(span.startedAt)))}`);
}

/* ── settled ─────────────────────────────────────────── */
// A merged job settles once its merge is older than settleAfterHours; it then leaves the Merged
// column and lives in the Settled dialog. Merge time is endedAt (evented) or updated (legacy).
const mergedAt = (j) => time(j.endedAt || j.updated);
const isSettled = (j, now = Date.now()) => j.stage === 'merged' && now - mergedAt(j) > settleHours * 3600_000;
const settledCount = (jobs, now) => (jobs || []).filter((j) => isSettled(j, now)).length;
let shownSettled = 0;
const when = (t) => new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function renderSettled(jobs) {
  const list = jobs.filter((j) => isSettled(j)).sort((a, b) => mergedAt(b) - mergedAt(a));
  shownSettled = list.length;
  const btn = $('settled-btn');
  btn.hidden = !list.length;
  btn.textContent = `Settled · ${list.length}`;
  $('settled-hours').textContent = `${settleHours}h`;
  const html = list.map((j) => {
    const total = j.startedAt && j.endedAt ? fmt(time(j.endedAt) - time(j.startedAt)) : '—';
    return `<button class="srow" type="button" data-id="${esc(j.id)}"><span class="st">${esc(j.title || j.id)}</span><span class="sm">${esc(when(mergedAt(j)))}</span>
      <span class="si">${esc(j.id)}</span><span class="sm">total ${esc(total)} · ${j.round ? `${j.round} round${j.round > 1 ? 's' : ''}` : '—'}</span></button>`;
  }).join('');
  const el = $('settled-list');
  if (el.dataset.html !== html) {  // don't rebuild (and drop focus) when nothing changed
    el.dataset.html = html; el.innerHTML = html;
    el.querySelectorAll('.srow').forEach((b) => b.addEventListener('click', () => { $('settled').close(); openDrawer(b.dataset.id); }));
  }
  if (!list.length && $('settled').open) $('settled').close();
}
$('settled-btn').addEventListener('click', () => $('settled').showModal());
$('settled-close').addEventListener('click', () => $('settled').close());
$('settled').addEventListener('click', (e) => { if (e.target === $('settled')) $('settled').close(); });  // scrim

/* ── board ───────────────────────────────────────────── */
function render() {
  renderSettled(board.jobs || []);
  const jobs = [...(board.jobs || [])].filter((j) => !isSettled(j)).sort((a, b) => time(b.updated) - time(a.updated));
  const human = jobs.filter((j) => j.stage === 'needs-human');
  const active = jobs.filter((j) => !['merged', 'needs-human'].includes(j.stage)).length;
  $('tally').textContent = jobs.length ? `— ${active} running${human.length ? `, ${human.length} waiting on you` : ''}` : '';

  if (!jobs.length) {
    $('main').innerHTML = `<div class="nothing">The line is quiet.<br><br>Start a job with <code>/factory &lt;feature&gt;</code> or <code>/factory next</code>.</div>`;
    return;
  }
  let html = '';
  if (human.length) {
    html += `<section class="andon"><div class="label">Needs a human · /factory approve | rework</div><div class="row">${human.map(card).join('')}</div></section>`;
  }
  html += `<section class="line">${STATIONS.map((st, i) => {
    const here = jobs.filter((j) => (j.stage === 'claimed' ? 'spec' : j.stage) === st.key);
    return `<div class="station ${here.length && st.key !== 'merged' ? 'live' : ''}">
      <div class="station-head"><div class="num">${String(i + 1).padStart(2, '0')}</div>
        <div class="name">${st.name}<span class="count">${here.length || ''}</span></div>
        <div class="who">${st.key === 'review' ? esc(reviewers.join(' · ')) : st.who}</div><span class="tick"></span></div>
      <div class="stack">${here.map(card).join('') || '<div class="empty">—</div>'}</div></div>`;
  }).join('')}</section>`;
  $('main').innerHTML = html;

  for (const j of jobs) lastStages[j.id] = j.stage;
  tick();
  document.querySelectorAll('.card').forEach((el) => el.addEventListener('click', () => openDrawer(el.dataset.id)));
}

// A round's chips are its own reviewers (round.started may list fewer than config), in config order; unknown keys last.
const roundKeys = (reviews) => Object.keys(reviews || {}).sort((a, b) => {
  const ia = reviewers.indexOf(a), ib = reviewers.indexOf(b);
  return (ia < 0 ? reviewers.length : ia) - (ib < 0 ? reviewers.length : ib);
});
const spanOf = (j, key, round) => (j.timing?.agents || []).filter((a) => a.role === 'reviewer' && a.key === key && a.round === round).pop();

function card(j) {
  const seen = j.id in lastStages, moved = seen && lastStages[j.id] !== j.stage;
  const rounds = [...(j.history || []).map((h) => ({ ...h, past: true }))];
  if (j.round > 0) rounds.push({ round: j.round, reviews: j.reviews || {}, past: false });
  const isLive = j.stage === 'review';
  const roundsHtml = rounds.length ? `<div class="rounds">${rounds.map((r) => `<div class="round ${r.past ? 'past' : ''}"><span class="r">R${r.round}</span>${
    roundKeys(r.reviews).map((k) => { const v = r.reviews[k]; return chipHtml(k, r.round, v, spanOf(j, k, r.round), isLive && !r.past); }).join('')
  }</div>`).join('')}</div>` : '';
  const decision = j.decision ? `<span class="decision ${j.decision.split(' ')[0]}">${esc(j.decision)}</span>` : '';
  return `<button class="card ${j.stage} ${seen ? '' : 'new'} ${moved ? 'moved' : ''}" data-id="${esc(j.id)}">
    <div class="top"><span class="id">${esc(j.id)}</span><span class="rnd">${j.round ? `round ${j.round}/${j.maxRound ?? 2}` : ''}</span></div>
    <div class="title">${esc(j.title || j.id)}</div>
    <div class="branch">${esc(j.branch || '')}</div>
    ${clockHtml(j)}${roundsHtml}${decision}${j.note ? `<div class="note">${esc(j.note)}</div>` : ''}</button>`;
}

/* ── drawer ──────────────────────────────────────────── */
// One request per refresh: serve.ts returns only the files that exist, in reading order.
// Group them by folder: the job's own files (and its brief), then one group per round.
function groupsOf(paths) {
  const groups = new Map([['Job', []]]);
  for (const p of paths) {
    const round = p.match(/\/round-(\d+)\//);
    const name = round ? `Round ${round[1]}` : 'Job';
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(p);
  }
  return [...groups];
}
const verdictOf = (text) => (text?.split('\n', 1)[0].match(/^(?:VERDICT:\s*)?(PASS|CHANGES|APPROVE|ESCALATE)\b/) || [])[1];

/* ── drawer timing ───────────────────────────────────── */
// The drawer carries a job's timing so it stays reachable after the card is gone (settled jobs
// show no chips): a one-line summary under the title, and a "timing" entry in the file list.
// Open spans render as live timers; the merged span is terminal and never counted.
const TIMING = '#timing';
const startOf = (s) => s.enteredAt || s.startedAt;
const endOf = (s) => s.exitedAt || s.finishedAt;
const spanMs = (s, now) => s.ms ?? (endOf(s) ? time(endOf(s)) : now) - time(startOf(s));
const isoAt = (t) => new Date(t).toISOString();
const workSpans = (j) => (j.timing?.stages || []).filter((s) => s.stage !== 'merged' && s.stage !== 'claimed');
const stageLabel = (stage) => (stage === 'needs-human' ? 'waiting' : stage);
// A duration cell: final for a closed span, ticking for an open one.
const durHtml = (s) => (endOf(s) ? esc(fmt(spanMs(s, Date.now()))) : live(startOf(s), ''));

function summaryHtml(j) {
  if (!j.timing) return '<span class="na">no timing recorded — this job predates the event log</span>';
  const total = j.endedAt ? esc(`total ${fmt(time(j.endedAt) - time(j.startedAt))}`) : live(j.startedAt, 'total ');
  // Per-stage sums across rounds; a stage with an open span ticks from (its start − the closed time).
  const sums = new Map();
  for (const s of workSpans(j)) {
    const e = sums.get(s.stage) || { closed: 0, open: null };
    if (endOf(s)) e.closed += spanMs(s, 0); else e.open = s;
    sums.set(s.stage, e);
  }
  const parts = [...sums].map(([stage, e]) => e.open
    ? live(isoAt(time(startOf(e.open)) - e.closed), `${stageLabel(stage)} `)
    : esc(`${stageLabel(stage)} ${fmt(e.closed)}`));
  const rounds = j.round ? esc(`${j.round} round${j.round > 1 ? 's' : ''}`) : '';
  return [total, ...parts, rounds].filter(Boolean).join(' · ');
}

function timingHtml(j) {
  const now = Date.now(), stages = workSpans(j);
  const used = [...new Set(stages.map((s) => s.stage))];
  const bar = stages.map((s) => `<span class="seg ${esc(s.stage)}" style="flex-grow:${Math.max(spanMs(s, now), 1)}" title="${esc(`${stageLabel(s.stage)}${s.round ? ` · R${s.round}` : ''} · ${fmt(spanMs(s, now))}`)}"></span>`).join('');
  const legend = used.map((st) => `<span><i class="seg ${esc(st)}"></i>${esc(stageLabel(st))}</span>`).join('');
  const stageRows = stages.map((s) => `<tr><td>${esc(stageLabel(s.stage))}</td><td>${s.round ? `R${s.round}` : '—'}</td><td>${esc(when(time(startOf(s))))}</td><td class="n">${durHtml(s)}</td></tr>`).join('');
  const agents = [...(j.timing.agents || [])].sort((a, b) => time(a.startedAt) - time(b.startedAt));
  const agentRows = agents.map((a) => {
    const who = a.role === 'reviewer' ? a.key : a.role;
    // Spec-writer and builder finish without a verdict; a reviewer or approver closed without one was stopped by an escalation.
    const graded = a.role === 'reviewer' || a.role === 'approver';
    const verdict = a.verdict ? `<span class="v ${esc(a.verdict)}"></span>${esc(a.verdict)}`
      : !endOf(a) ? 'running' : graded ? '<span class="na">stopped</span>' : 'done';
    return `<tr><td>${esc(who)}</td><td>${a.round ? `R${a.round}` : '—'}</td><td>${verdict}</td><td>${esc(when(time(a.startedAt)))}</td><td class="n">${durHtml(a)}</td></tr>`;
  }).join('');
  const total = j.endedAt ? esc(fmt(time(j.endedAt) - time(j.startedAt))) : live(j.startedAt, '');
  return `<h1>Timing</h1>
    <p>Claimed ${esc(when(time(j.startedAt)))}${j.endedAt ? ` · merged ${esc(when(time(j.endedAt)))}` : ''} · total ${total}</p>
    ${stages.length ? `<div class="tbar">${bar}</div><div class="tlegend">${legend}</div>` : ''}
    <h2>Stages</h2>
    ${stageRows ? `<table class="tt"><thead><tr><th>Stage</th><th>Round</th><th>Entered</th><th class="n">Duration</th></tr></thead><tbody>${stageRows}</tbody></table>` : '<p class="empty">No stages yet.</p>'}
    <h2>Agents</h2>
    ${agentRows ? `<table class="tt"><thead><tr><th>Agent</th><th>Round</th><th>Result</th><th>Started</th><th class="n">Duration</th></tr></thead><tbody>${agentRows}</tbody></table>` : '<p class="empty">No agents have run yet.</p>'}`;
}

let docs = {}, shown = null;  // shown: the [file, text] the doc pane last rendered
async function refreshDrawer() {
  const j = board.jobs.find((x) => x.id === openId);
  if (!j) return closeDrawer();
  $('d-id').textContent = `${j.id} · ${j.stage}`;
  $('d-title').textContent = j.title || j.id;
  $('d-sum').innerHTML = summaryHtml(j);
  tick();
  let files;
  try { files = (await getJSON(`jobs/${encodeURIComponent(j.id)}/docs`)).files || []; } catch { return; }  // keep what's shown
  if (openId !== j.id) return;  // the drawer moved on while this was in flight
  docs = Object.fromEntries(files.map((f) => [f.path, f.text]));
  const groups = groupsOf(files.map((f) => f.path));
  const timingBtn = j.timing ? `<button class="file" data-f="${TIMING}"><span>timing</span></button>` : '';
  $('files').innerHTML = groups.map(([name, files]) => {
    const present = files.filter((f) => f in docs);
    const lead = name === 'Job' ? timingBtn : '';
    return present.length || lead ? `<div class="label">${name}</div>${lead}${present.map((f) => {
      const v = verdictOf(docs[f]);
      return `<button class="file ${f === openFile ? 'on' : ''}" data-f="${esc(f)}"><span>${f.startsWith('briefs/') ? 'brief' : esc(f.split('/').slice(-1)[0].replace('review-', ''))}</span>${v ? `<span class="v ${v}"></span>` : ''}</button>`;
    }).join('')}` : '';
  }).join('') || '<div class="empty">no files yet</div>';
  $('files').querySelectorAll('.file').forEach((b) => b.addEventListener('click', () => { openFile = b.dataset.f; refreshDrawer(); }));
  if (openFile === TIMING && !j.timing) openFile = null;
  if (openFile !== TIMING && !(openFile in docs)) openFile = Object.keys(docs).filter((f) => !f.endsWith('feature.md')).pop() || Object.keys(docs)[0] || null;
  $('files').querySelectorAll('.file').forEach((b) => b.classList.toggle('on', b.dataset.f === openFile));
  // Re-render the document only when it changed, so a poll doesn't reset scroll or reload images.
  const text = openFile === TIMING ? JSON.stringify([j.timing, j.endedAt]) : docs[openFile];
  if (shown && shown[0] === openFile && shown[1] === text) return;
  shown = [openFile, text];
  $('doc').innerHTML = openFile === TIMING ? timingHtml(j)
    : openFile ? markdown(docs[openFile], openFile.replace(/[^/]*$/, '')) : '<p class="empty">Nothing written yet.</p>';
  tick();
}
function openDrawer(id) {
  if (openId !== id) { openId = id; openFile = null; shown = null; $('doc').parentElement.scrollTop = 0; }
  $('drawer').classList.add('open'); $('scrim').classList.add('open'); $('drawer').setAttribute('aria-hidden', 'false');
  refreshDrawer();
}
function closeDrawer() {
  openId = null; $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true');
}
$('close').addEventListener('click', closeDrawer);
$('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

/* ── tiny markdown renderer (input is escaped first) ─── */
let mdBase = '';  // folder of the file being rendered, so ![](ui/x.png) resolves
function inline(s) {
  return s
    .replace(/!\[([^\]]*)\]\(([\w./-]+\.(?:png|jpe?g|webp|gif))\)/g, (_, alt, src) => `<a href="${mdBase}${src}" target="_blank" rel="noopener"><img src="${mdBase}${src}" alt="${alt}" loading="lazy"></a>`)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function markdown(src, base = '') {
  mdBase = base;
  const lines = esc(src).split('\n');
  const out = [];
  const first = lines[0]?.match(/^(?:VERDICT:\s*)?(PASS|CHANGES|APPROVE|ESCALATE)\s*$/);
  if (first) { out.push(`<div class="stamp ${first[1]}">${first[1]}</div>`); lines.shift(); }
  for (let i = 0; i < lines.length; ) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${buf.join('\n')}</code></pre>`); continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
      const cells = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const items = [];
      while (i < lines.length) {
        if (/^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''));
        else if (/^\s{2,}\S/.test(lines[i])) items[items.length - 1] += ' ' + lines[i++].trim();
        else break;
      }
      out.push(`<${ordered ? 'ol' : 'ul'}>${items.map((it) => {
        const t = it.match(/^\[([ xX])\]\s+(.*)/);
        return t ? `<li class="task">${t[1] === ' ' ? '☐' : '☑'} ${inline(t[2])}</li>` : `<li>${inline(it)}</li>`;
      }).join('')}</${ordered ? 'ol' : 'ul'}>`);
      continue;
    }
    if (/^&gt;\s?/.test(l)) {
      const buf = []; while (i < lines.length && /^&gt;\s?/.test(lines[i])) buf.push(lines[i++].replace(/^&gt;\s?/, ''));
      out.push(`<blockquote>${inline(buf.join(' '))}</blockquote>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*([-*]|\d+\.)\s+|&gt;|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(' '))}</p>`);
  }
  return out.join('\n');
}

let timer = null, polling = false;
async function loop() {
  clearTimeout(timer);
  if (polling) return;  // the in-flight poll schedules the next one
  polling = true;
  try { await poll(); } finally { polling = false; }
  if (!document.hidden) timer = setTimeout(loop, POLL_MS);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); loop(); } });
loop();
</script>
</body>
</html>
